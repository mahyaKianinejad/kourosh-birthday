<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a10">
<title>Kourosh | Birthday Celebration</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10}
body{display:grid;place-items:center;background:radial-gradient(ellipse at center,#201b25 0%,#080a10 75%)}
.stage{width:100vw;height:100vh;height:100dvh;display:grid;place-items:center;overflow:hidden}
.poster{position:relative;width:min(100vw,66.6667dvh);aspect-ratio:2/3;max-height:100dvh;overflow:hidden}
.poster>img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}
.head-hover{position:absolute;left:38%;top:16%;width:25%;height:16%;border:0;background:transparent;padding:0;cursor:pointer;outline:none}
.hearts{position:absolute;inset:-12%;display:flex;align-items:center;justify-content:center;gap:5%;opacity:0;pointer-events:none;transition:opacity .2s ease}
.head-hover:hover .hearts,.head-hover:focus-visible .hearts,.head-hover.active .hearts{opacity:1}
.heart{font:clamp(24px,5.5vh,54px)/1 Arial,sans-serif;color:#ff4775;text-shadow:0 0 12px #ff174f,0 0 28px #ff174f;animation:pulse .65s ease-in-out infinite alternate}
.heart:nth-child(2){font-size:clamp(18px,4vh,40px);animation-delay:.12s}
.heart:nth-child(3){font-size:clamp(20px,4.5vh,46px);animation-delay:.24s}
@keyframes pulse{to{transform:scale(1.25)}}
.map-link{position:absolute;left:20%;top:73%;width:62%;height:8%;display:block;background:transparent;border-radius:10px;cursor:pointer}
@media(prefers-reduced-motion:reduce){.heart{animation:none}.hearts{transition:none}}
</style>
</head>
<body>
<main class="stage">
 <div class="poster">
  <img src="./invitation-poster.jpg" alt="Kourosh birthday invitation with Kourosh and his golden retriever">
  <button class="head-hover" type="button" aria-label="Show hearts around Kourosh" onclick="this.classList.toggle('active')">
   <span class="hearts" aria-hidden="true"><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span></span>
  </button>
  <a class="map-link" href="https://maps.app.goo.gl/eUVVCWLukF2RhRGx8" target="_blank" rel="noopener" aria-label="Open Café Lovent location in Google Maps" title="Open Café Lovent in Maps"></a>
 </div>
</main>
<audio id="bgmusic" autoplay loop preload="auto" playsinline>
 <source src="./Learning-To-Fly.mp3" type="audio/mpeg">
</audio>
<script>
(()=>{const a=document.getElementById('bgmusic');a.volume=.72;
const start=()=>{const p=a.play();if(p&&p.catch)p.catch(()=>{});};
start();
['pointerdown','touchstart','keydown'].forEach(evt=>window.addEventListener(evt,start,{once:true,passive:true}));
})();
</script>
</body>
</html>
